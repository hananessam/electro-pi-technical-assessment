openapi: 3.0.3
info:
  title: Electro PI Technical Assessment API
  description: API documentation for the Auth, Project, and Task modules.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Project
    description: Project management endpoints
  - name: Task
    description: Task management endpoints
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Invalid credentials
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout the authenticated user
      operationId: authLogout
      security:
        - sanctumToken: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out successfully
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Unauthenticated.

  /projects:
    get:
      tags: [Project]
      summary: List the authenticated user's projects
      operationId: projectIndex
      security:
        - sanctumToken: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

    post:
      tags: [Project]
      summary: Create a new project
      operationId: projectStore
      security:
        - sanctumToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /projects/{project}:
    get:
      tags: [Project]
      summary: Show a single project
      operationId: projectShow
      security:
        - sanctumToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Project belongs to another user
        '404':
          description: Project not found

    put:
      tags: [Project]
      summary: Update a project
      operationId: projectUpdate
      security:
        - sanctumToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Project belongs to another user
        '404':
          description: Project not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

    delete:
      tags: [Project]
      summary: Delete a project
      operationId: projectDestroy
      security:
        - sanctumToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Project deleted successfully
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Project belongs to another user
        '404':
          description: Project not found

  /tasks:
    get:
      tags: [Task]
      summary: List tasks belonging to the authenticated user's projects
      operationId: taskIndex
      security:
        - sanctumToken: []
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

    post:
      tags: [Task]
      summary: Create a new task on one of the authenticated user's projects
      operationId: taskStore
      security:
        - sanctumToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Project belongs to another user
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /tasks/{task}:
    get:
      tags: [Task]
      summary: Show a single task
      operationId: taskShow
      security:
        - sanctumToken: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Task's project belongs to another user
        '404':
          description: Task not found

    put:
      tags: [Task]
      summary: Update a task
      operationId: taskUpdate
      security:
        - sanctumToken: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Task's project belongs to another user
        '404':
          description: Task not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

    delete:
      tags: [Task]
      summary: Delete a task
      operationId: taskDestroy
      security:
        - sanctumToken: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Task deleted successfully
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Task's project belongs to another user
        '404':
          description: Task not found

components:
  parameters:
    ProjectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
      description: The project ID

    TaskId:
      name: task
      in: path
      required: true
      schema:
        type: integer
      description: The task ID

  securitySchemes:
    sanctumToken:
      type: http
      scheme: bearer
      bearerFormat: 'Sanctum personal access token'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: password

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password
        password_confirmation:
          type: string
          format: password
          example: password

    User:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: 1|abcdefghijklmnopqrstuvwxyz0123456789
        user:
          $ref: '#/components/schemas/User'

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Website Redesign
        description:
          type: string
          nullable: true
          example: Redesign the company marketing website
        status:
          type: string
          enum: [active, completed, archived]
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: Website Redesign
        description:
          type: string
          nullable: true
          example: Redesign the company marketing website
        status:
          type: string
          enum: [active, completed, archived]
          example: active

    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        title:
          type: string
          example: Design the homepage mockup
        description:
          type: string
          nullable: true
          example: Create high-fidelity mockups for the new homepage
        status:
          type: string
          enum: [todo, in_progress, done]
          example: todo
        priority:
          type: string
          enum: [low, medium, high]
          example: medium
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskRequest:
      type: object
      required: [project_id, title, status, priority]
      properties:
        project_id:
          type: integer
          example: 1
        title:
          type: string
          maxLength: 255
          example: Design the homepage mockup
        description:
          type: string
          nullable: true
          example: Create high-fidelity mockups for the new homepage
        status:
          type: string
          enum: [todo, in_progress, done]
          example: todo
        priority:
          type: string
          enum: [low, medium, high]
          example: medium
        due_date:
          type: string
          format: date
          nullable: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          example: Design the homepage mockup
        description:
          type: string
          nullable: true
          example: Create high-fidelity mockups for the new homepage
        status:
          type: string
          enum: [todo, in_progress, done]
          example: todo
        priority:
          type: string
          enum: [low, medium, high]
          example: medium
        due_date:
          type: string
          format: date
          nullable: true

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: The email field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
